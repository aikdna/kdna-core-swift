name: Swift public contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check public source, frozen inputs and preserved history
        run: python3 scripts/check_public_surface.py
      - name: Prove the public gate rejects regressions
        run: python3 scripts/test_public_surface.py
      - name: Build, test and consume the current Apple library
        run: python3 scripts/verify_native.py --work-dir "${{ runner.temp }}/kdna-swift-native" --ios
